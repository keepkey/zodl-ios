name: Verify Proto Hashes

on:
  push:
    paths:
      - 'proto/**'
      - '.github/proto-hashes.sha256'
  pull_request:
    paths:
      - 'proto/**'
      - '.github/proto-hashes.sha256'

jobs:
  verify-proto-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for proto files
        id: probe
        run: |
          if [ -d proto ] && [ "$(ls -A proto/*.proto 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No proto/ directory found — skipping hash check"
          fi

      - name: Verify SHA256 hashes
        if: steps.probe.outputs.present == 'true'
        run: |
          HASH_FILE=".github/proto-hashes.sha256"
          if [ ! -f "$HASH_FILE" ]; then
            echo "No $HASH_FILE found (feature branch without fork-only files) — skipping hash check"
            exit 0
          fi
          cd proto
          sha256sum --check "../$HASH_FILE"
